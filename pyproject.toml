[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aio"
version = "0.1.0"
description = "Modulares All-in-One-Toolkit für Termux und Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Bessere Plural- und Zahlen-/Datumsformate. Ohne babel greift ein eingebauter Fallback.
locale = ["babel>=2.12"]
dev = ["pytest>=7"]

[project.scripts]
aio = "aio.core.main:main"

[tool.setuptools.packages.find]
include = ["aio*"]

[tool.setuptools.package-data]
"aio" = ["locales/*.json", "plugins/*/*.json", "plugins/*/*.py", "plugins/*/locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
